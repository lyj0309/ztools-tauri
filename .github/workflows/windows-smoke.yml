name: Windows Desktop Smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose portable executable is tested
        required: true
        default: v0.1.17

permissions:
  contents: read

concurrency:
  group: windows-desktop-smoke-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download released portable executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $asset = "ZTools_$($env:RELEASE_TAG)_windows_x64_portable.exe"
          # 使用稳定的文件地址，避免 Release 元数据缓存指向被重传后已删除的 asset ID。
          $downloadUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:RELEASE_TAG)/$asset"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "artifacts/$asset"
          if ((Get-Item "artifacts/$asset").Length -lt 1MB) {
            throw 'Portable executable download is unexpectedly small'
          }
          Get-FileHash "artifacts/$asset" -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path |
            ConvertTo-Json | Set-Content artifacts/release-hash.json

      - name: Exercise launcher, screenshot editor, and floating pin
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class DesktopNative {
              private delegate bool EnumWindowsProc(IntPtr window, IntPtr parameter);

              [StructLayout(LayoutKind.Sequential)]
              public struct Rect {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr parameter);

              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr window, out uint processId);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr window);

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr window);

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr window, out Rect rect);

              [DllImport("user32.dll")]
              public static extern bool GetClientRect(IntPtr window, out Rect rect);

              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int x, int y);

              [DllImport("user32.dll")]
              public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);

              [DllImport("user32.dll")]
              public static extern void keybd_event(byte virtualKey, byte scanCode, uint flags, UIntPtr extraInfo);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr window, StringBuilder text, int maxCount);

              public static IntPtr FindLargestVisibleWindow(int processId) {
                  IntPtr result = IntPtr.Zero;
                  long largestArea = 0;
                  EnumWindows(delegate (IntPtr window, IntPtr parameter) {
                      uint owner;
                      GetWindowThreadProcessId(window, out owner);
                      Rect rect;
                      if (owner == processId && IsWindowVisible(window) && GetWindowRect(window, out rect)) {
                          long width = Math.Max(0, rect.Right - rect.Left);
                          long height = Math.Max(0, rect.Bottom - rect.Top);
                          long area = width * height;
                          if (area > largestArea) {
                              largestArea = area;
                              result = window;
                          }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }

              public static IntPtr FindVisibleWindowByTitleNearSize(string title, int expectedWidth, int expectedHeight) {
                  IntPtr result = IntPtr.Zero;
                  long bestDistance = long.MaxValue;
                  EnumWindows(delegate (IntPtr window, IntPtr parameter) {
                      Rect rect;
                      StringBuilder text = new StringBuilder(256);
                      GetWindowText(window, text, text.Capacity);
                      if (text.ToString() == title && IsWindowVisible(window) && GetWindowRect(window, out rect)) {
                          long width = Math.Max(0, rect.Right - rect.Left);
                          long height = Math.Max(0, rect.Bottom - rect.Top);
                          long distance = Math.Abs(width - expectedWidth) + Math.Abs(height - expectedHeight);
                          if (distance < bestDistance) {
                              bestDistance = distance;
                              result = window;
                          }
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }
          }
          '@

          function Wait-ProcessWindow {
            param(
              [int]$ProcessId,
              [int]$MinWidth,
              [int]$MinHeight,
              [int]$TimeoutSeconds = 20
            )
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              $window = [DesktopNative]::FindLargestVisibleWindow($ProcessId)
              if ($window -ne [IntPtr]::Zero) {
                $rect = New-Object DesktopNative+Rect
                if ([DesktopNative]::GetWindowRect($window, [ref]$rect)) {
                  $width = $rect.Right - $rect.Left
                  $height = $rect.Bottom - $rect.Top
                  if ($width -ge $MinWidth -and $height -ge $MinHeight) {
                    return $window
                  }
                }
              }
              Start-Sleep -Milliseconds 250
            }
            throw "Timed out waiting for process $ProcessId window of at least ${MinWidth}x${MinHeight}"
          }

          function Wait-WindowByTitleNearSize {
            param(
              [string]$Title,
              [int]$ExpectedWidth,
              [int]$ExpectedHeight,
              [int]$Tolerance = 120,
              [int]$TimeoutSeconds = 20
            )
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              $window = [DesktopNative]::FindVisibleWindowByTitleNearSize($Title, $ExpectedWidth, $ExpectedHeight)
              if ($window -ne [IntPtr]::Zero) {
                $rect = New-Object DesktopNative+Rect
                if ([DesktopNative]::GetWindowRect($window, [ref]$rect)) {
                  $width = $rect.Right - $rect.Left
                  $height = $rect.Bottom - $rect.Top
                  if ([Math]::Abs($width - $ExpectedWidth) -le $Tolerance -and
                      [Math]::Abs($height - $ExpectedHeight) -le $Tolerance) {
                    return $window
                  }
                }
              }
              Start-Sleep -Milliseconds 250
            }
            throw "Timed out waiting for $Title window near ${ExpectedWidth}x${ExpectedHeight}"
          }

          function Save-DesktopScreenshot {
            param([string]$Path)
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }

          function Assert-EditorImageVisible {
            param([string]$Path, [DesktopNative+Rect]$Bounds)
            $bitmap = [System.Drawing.Bitmap]::FromFile((Resolve-Path $Path).Path)
            try {
              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $left = [Math]::Max(0, $Bounds.Left - $screen.Left + 24)
              $top = [Math]::Max(0, $Bounds.Top - $screen.Top + 24)
              $right = [Math]::Min($bitmap.Width, $Bounds.Right - $screen.Left - 24)
              $bottom = [Math]::Min($bitmap.Height, $Bounds.Bottom - $screen.Top - 90)
              $colors = New-Object 'System.Collections.Generic.HashSet[int]'
              for ($y = $top; $y -lt $bottom; $y += 8) {
                for ($x = $left; $x -lt $right; $x += 8) {
                  [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
                }
              }
              if ($colors.Count -lt 12) {
                throw "Screenshot editor canvas is blank or not painted ($($colors.Count) sampled colors)"
              }
              return $colors.Count
            } finally {
              $bitmap.Dispose()
            }
          }

          function Assert-RedAnnotationVisible {
            param([string]$Path, [DesktopNative+Rect]$Bounds)
            $bitmap = [System.Drawing.Bitmap]::FromFile((Resolve-Path $Path).Path)
            try {
              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $count = 0
              for ($y = $Bounds.Top - $screen.Top + 40; $y -lt $Bounds.Bottom - $screen.Top - 90; $y += 2) {
                for ($x = $Bounds.Left - $screen.Left + 40; $x -lt $Bounds.Right - $screen.Left - 40; $x += 2) {
                  $color = $bitmap.GetPixel($x, $y)
                  if ($color.R -gt 180 -and $color.G -lt 110 -and $color.B -lt 150) { $count++ }
                }
              }
              if ($count -lt 20) { throw "Screenshot rectangle annotation was not painted ($count red pixels)" }
              return $count
            } finally {
              $bitmap.Dispose()
            }
          }

          function Stop-TestProcess {
            param([System.Diagnostics.Process]$Process)
            if ($Process -and -not $Process.HasExited) {
              Stop-Process -Id $Process.Id -Force
              $Process.WaitForExit(10000) | Out-Null
            }
          }

          $asset = "ZTools_$($env:RELEASE_TAG)_windows_x64_portable.exe"
          $executable = (Resolve-Path "artifacts/$asset").Path
          $testRoot = Join-Path $env:RUNNER_TEMP 'ztools-windows-smoke'
          $env:ZTOOLS_E2E = '1'
          $env:ZTOOLS_DATA_ROOT = Join-Path $testRoot 'data'
          $env:ZTOOLS_PLUGIN_ROOT = Join-Path $testRoot 'plugins'
          $diagnostics = [ordered]@{
            releaseTag = $env:RELEASE_TAG
            executable = $executable
            launcherVisible = $false
            editorVisible = $false
            pinVisible = $false
            clipboardVisible = $false
            clipboardFileTabVisible = $false
            breakSettingsVisible = $false
            breakSettingsEmbedded = $false
            breakSettingsDetached = $false
            breakSkipClosedWindow = $false
          }

          $launcherProcess = $null
          $screenshotProcess = $null
          $historyProcess = $null
          $breakSettingsProcess = $null
          $breakProcess = $null
          $clipboardProcess = $null
          try {
            Remove-Item Env:ZTOOLS_E2E_PLUGIN_NAME -ErrorAction SilentlyContinue
            Remove-Item Env:ZTOOLS_E2E_PLUGIN_FEATURE -ErrorAction SilentlyContinue
            $launcherProcess = Start-Process -FilePath $executable -PassThru `
              -RedirectStandardOutput 'artifacts/launcher-stdout.log' `
              -RedirectStandardError 'artifacts/launcher-stderr.log'
            $launcher = Wait-ProcessWindow -ProcessId $launcherProcess.Id -MinWidth 700 -MinHeight 40
            $diagnostics.launcherVisible = $true
            Save-DesktopScreenshot -Path 'artifacts/01-launcher.png'
            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.24') {
              # 使用主窗口真实键盘入口打开剪贴板，再确认返回搜索后的最近使用和重启持久化。
              $launcherRect = New-Object DesktopNative+Rect
              [DesktopNative]::GetWindowRect($launcher, [ref]$launcherRect) | Out-Null
              [DesktopNative]::SetForegroundWindow($launcher) | Out-Null
              [DesktopNative]::SetCursorPos($launcherRect.Left + 230, $launcherRect.Top + 30) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              foreach ($letter in 'CLIPBOARD'.ToCharArray()) {
                $key = [byte][int][char]$letter
                [DesktopNative]::keybd_event($key, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::keybd_event($key, 0, 0x0002, [UIntPtr]::Zero)
                Start-Sleep -Milliseconds 25
              }
              $searchResults = Wait-ProcessWindow -ProcessId $launcherProcess.Id -MinWidth 700 -MinHeight 175
              Start-Sleep -Seconds 1
              Save-DesktopScreenshot -Path 'artifacts/15-plugin-search.png'
              $diagnostics.pluginSearchCaptured = $true
              [DesktopNative]::keybd_event(0x0D, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::keybd_event(0x0D, 0, 0x0002, [UIntPtr]::Zero)
              $pluginHost = Wait-ProcessWindow -ProcessId $launcherProcess.Id -MinWidth 700 -MinHeight 550
              Start-Sleep -Seconds 2
              Save-DesktopScreenshot -Path 'artifacts/16-plugin-open.png'
              $diagnostics.pluginHeaderCaptured = $true
              [DesktopNative]::GetWindowRect($pluginHost, [ref]$launcherRect) | Out-Null
              [DesktopNative]::SetForegroundWindow($pluginHost) | Out-Null
              [DesktopNative]::SetCursorPos($launcherRect.Left + 300, $launcherRect.Top + 30) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::keybd_event(0x1B, 0, 0x0002, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              [DesktopNative]::GetWindowRect($launcher, [ref]$launcherRect) | Out-Null
              if ($launcherRect.Bottom - $launcherRect.Top -ge 400) {
                throw 'Plugin did not return to recent use after Escape'
              }
              Save-DesktopScreenshot -Path 'artifacts/17-plugin-recent.png'
              $diagnostics.pluginRecentCaptured = $true
              Stop-TestProcess -Process $launcherProcess
              Start-Sleep -Seconds 2
              $launcherProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/launcher-restart-stdout.log' `
                -RedirectStandardError 'artifacts/launcher-restart-stderr.log'
              $launcher = Wait-ProcessWindow -ProcessId $launcherProcess.Id -MinWidth 700 -MinHeight 175
              Start-Sleep -Seconds 1
              Save-DesktopScreenshot -Path 'artifacts/18-plugin-recent-restart.png'
              $diagnostics.pluginRecentRestartCaptured = $true
            }
            Stop-TestProcess -Process $launcherProcess
            Start-Sleep -Seconds 2

            $env:ZTOOLS_E2E_PLUGIN_NAME = 'screenshot'
            $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'capture'
            $screenshotProcess = Start-Process -FilePath $executable -PassThru `
              -RedirectStandardOutput 'artifacts/screenshot-stdout.log' `
              -RedirectStandardError 'artifacts/screenshot-stderr.log'
            $editor = Wait-ProcessWindow -ProcessId $screenshotProcess.Id -MinWidth 800 -MinHeight 600
            $diagnostics.editorVisible = $true
            $editorRect = New-Object DesktopNative+Rect
            if (-not [DesktopNative]::GetWindowRect($editor, [ref]$editorRect)) {
              throw 'Unable to read screenshot editor bounds'
            }
            $diagnostics.editorBounds = @($editorRect.Left, $editorRect.Top, $editorRect.Right, $editorRect.Bottom)
            if (($editorRect.Right - $editorRect.Left) -lt 800 -or ($editorRect.Bottom - $editorRect.Top) -lt 600) {
              throw 'Screenshot editor did not cover a usable desktop area'
            }
            Save-DesktopScreenshot -Path 'artifacts/02-editor.png'

            [DesktopNative]::SetForegroundWindow($editor) | Out-Null
            $startX = $editorRect.Left + 120
            $startY = $editorRect.Top + 100
            $endX = [Math]::Min($editorRect.Right - 180, $startX + 700)
            $endY = [Math]::Min($editorRect.Bottom - 160, $startY + 440)
            [DesktopNative]::SetCursorPos($startX, $startY) | Out-Null
            [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            for ($step = 1; $step -le 12; $step++) {
              $x = [Math]::Round($startX + (($endX - $startX) * $step / 12))
              $y = [Math]::Round($startY + (($endY - $startY) * $step / 12))
              [DesktopNative]::SetCursorPos($x, $y) | Out-Null
              Start-Sleep -Milliseconds 35
            }
            [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Seconds 2
            Save-DesktopScreenshot -Path 'artifacts/03-selection.png'

            $usesOriginalEditor = [version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.22'
            if ($usesOriginalEditor) {
              # 选区窗口会原位变成紧凑标注窗口，后续点击都以新边界为基准。
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                [DesktopNative]::GetWindowRect($editor, [ref]$editorRect) | Out-Null
                if (($editorRect.Right - $editorRect.Left) -lt 800 -or
                    ($editorRect.Bottom - $editorRect.Top) -lt 600) { break }
                Start-Sleep -Milliseconds 300
              }
              if (($editorRect.Right - $editorRect.Left) -ge 800 -and
                  ($editorRect.Bottom - $editorRect.Top) -ge 600) {
                throw 'Original screenshot annotation window did not open after selection'
              }
              $diagnostics.annotationBounds = @($editorRect.Left, $editorRect.Top, $editorRect.Right, $editorRect.Bottom)
              $diagnostics.editorImageColors = Assert-EditorImageVisible -Path 'artifacts/03-selection.png' -Bounds $editorRect
            }

            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.15') {
              # 从实际截图选区运行系统 OCR，通过真实键盘复制结果验证完整 IPC 链路。
              Set-Clipboard -Value 'ZTOOLS_OCR_PENDING'
              if ($usesOriginalEditor) {
                [DesktopNative]::SetCursorPos($editorRect.Right - 108, $editorRect.Bottom - 42) | Out-Null
                [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              } else {
                [DesktopNative]::keybd_event(0x4F, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::keybd_event(0x4F, 0, 0x0002, [UIntPtr]::Zero)
              }
              $recognized = ''
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                Start-Sleep -Seconds 1
                # 只有识别完成后，面板的“复制文字”按钮才会启用。
                if ($usesOriginalEditor) {
                  [DesktopNative]::SetCursorPos($editorRect.Right - 388, $editorRect.Top + 205) | Out-Null
                } else {
                  [DesktopNative]::SetCursorPos($editorRect.Right - 84, $editorRect.Top + 466) | Out-Null
                }
                [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
                Start-Sleep -Milliseconds 150
                $recognized = Get-Clipboard -Raw
                if ($recognized -and $recognized -ne 'ZTOOLS_OCR_PENDING' -and $recognized.Length -gt 20) { break }
              }
              Save-DesktopScreenshot -Path 'artifacts/09-screenshot-ocr.png'
              if (-not $recognized -or $recognized -eq 'ZTOOLS_OCR_PENDING' -or $recognized.Length -le 20) {
                throw 'Screenshot OCR did not produce copyable text from the desktop selection'
              }
              $diagnostics.screenshotOcrCopied = $true
              $diagnostics.screenshotOcrCharacters = $recognized.Length
              # 直接点击面板关闭按钮，避免焦点不在面板时 Escape 退出整个截图编辑器。
              if ($usesOriginalEditor) {
                [DesktopNative]::SetCursorPos($editorRect.Right - 313, $editorRect.Top + 205) | Out-Null
              } else {
                [DesktopNative]::SetCursorPos($editorRect.Right - 60, $editorRect.Top + 98) | Out-Null
              }
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
            }

            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.25') {
              # 用真实鼠标画矩形并检查成品颜色，避免“画布可见但标注未落图”。
              [DesktopNative]::SetCursorPos($editorRect.Left + 74, $editorRect.Bottom - 42) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::SetCursorPos($editorRect.Left + 130, $editorRect.Top + 100) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::SetCursorPos($editorRect.Left + 340, $editorRect.Top + 210) | Out-Null
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Seconds 1
              Save-DesktopScreenshot -Path 'artifacts/03-annotation.png'
              $diagnostics.annotationRedPixels = Assert-RedAnnotationVisible -Path 'artifacts/03-annotation.png' -Bounds $editorRect
            }

            # 原版标注工具栏点击贴图，旧版保留 P 快捷键；两者都覆盖二进制 IPC 和贴图窗口链路。
            [DesktopNative]::SetForegroundWindow($editor) | Out-Null
            if ($usesOriginalEditor) {
              [DesktopNative]::SetCursorPos($editorRect.Right - 83, $editorRect.Bottom - 42) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
            } else {
              [DesktopNative]::keybd_event(0x50, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::keybd_event(0x50, 0, 0x0002, [UIntPtr]::Zero)
            }
            Start-Sleep -Seconds 1
            Save-DesktopScreenshot -Path 'artifacts/04-after-pin-click.png'
            $pin = Wait-WindowByTitleNearSize `
              -Title 'ZTools 贴图' `
              -ExpectedWidth ($endX - $startX) `
              -ExpectedHeight ($endY - $startY)
            $diagnostics.pinVisible = $true
            $pinRect = New-Object DesktopNative+Rect
            [DesktopNative]::GetWindowRect($pin, [ref]$pinRect) | Out-Null
            $diagnostics.pinBounds = @($pinRect.Left, $pinRect.Top, $pinRect.Right, $pinRect.Bottom)
            if ($usesOriginalEditor -and
                ([Math]::Abs($pinRect.Left - $startX) -gt 8 -or [Math]::Abs($pinRect.Top - $startY) -gt 8)) {
              throw "Floating image moved from original selection: expected ($startX,$startY), got ($($pinRect.Left),$($pinRect.Top))"
            }
            Save-DesktopScreenshot -Path 'artifacts/05-pin.png'

            # 滚轮必须同时改变宽高，校验客户区以排除 Windows 非客户区边框影响。
            $before = New-Object DesktopNative+Rect
            [DesktopNative]::GetClientRect($pin, [ref]$before) | Out-Null
            [DesktopNative]::SetCursorPos($pinRect.Left + 150, $pinRect.Top + 150) | Out-Null
            [DesktopNative]::SetForegroundWindow($pin) | Out-Null
            [DesktopNative]::mouse_event(0x0800, 0, 0, 120, [UIntPtr]::Zero)
            Start-Sleep -Seconds 2
            $after = New-Object DesktopNative+Rect
            [DesktopNative]::GetClientRect($pin, [ref]$after) | Out-Null
            if ($after.Right -le $before.Right -or $after.Bottom -le $before.Bottom) {
              throw 'Mouse wheel did not enlarge the floating image'
            }
            $expectedHeight = $after.Right * $before.Bottom / $before.Right
            if ([Math]::Abs($after.Bottom - $expectedHeight) -gt 2) {
              throw 'Floating image aspect ratio changed after scaling'
            }
            $diagnostics.pinAspectRatioPreserved = $true
            Save-DesktopScreenshot -Path 'artifacts/06-pin-scaled.png'

            # 通过真实贴图快捷键复制原图，让后台监控保存后重启应用验证历史持久化。
            [DesktopNative]::SetForegroundWindow($pin) | Out-Null
            [DesktopNative]::keybd_event(0x11, 0, 0, [UIntPtr]::Zero)
            [DesktopNative]::keybd_event(0x43, 0, 0, [UIntPtr]::Zero)
            [DesktopNative]::keybd_event(0x43, 0, 0x0002, [UIntPtr]::Zero)
            [DesktopNative]::keybd_event(0x11, 0, 0x0002, [UIntPtr]::Zero)
            Start-Sleep -Seconds 3
            Stop-TestProcess -Process $screenshotProcess
            $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'pin'
            $historyProcess = Start-Process -FilePath $executable -PassThru `
              -RedirectStandardOutput 'artifacts/history-stdout.log' `
              -RedirectStandardError 'artifacts/history-stderr.log'
            $picker = Wait-ProcessWindow -ProcessId $historyProcess.Id -MinWidth 600 -MinHeight 400
            Start-Sleep -Seconds 2
            Save-DesktopScreenshot -Path 'artifacts/07-image-history.png'
            [DesktopNative]::SetForegroundWindow($picker) | Out-Null
            [DesktopNative]::keybd_event(0x0D, 0, 0, [UIntPtr]::Zero)
            [DesktopNative]::keybd_event(0x0D, 0, 0x0002, [UIntPtr]::Zero)
            $historyPin = Wait-WindowByTitleNearSize -Title 'ZTools 贴图' `
              -ExpectedWidth ($endX - $startX) -ExpectedHeight ($endY - $startY)
            if ([DesktopNative]::IsWindowVisible($picker)) {
              throw 'History picker stayed visible after pinning selected image'
            }
            $diagnostics.historyImagePinned = $true
            Save-DesktopScreenshot -Path 'artifacts/08-history-pin.png'

            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.25') {
              # 取消流程必须关闭编辑器，避免残留全屏蒙层或卡住启动器。
              Stop-TestProcess -Process $historyProcess
              $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'capture'
              $cancelProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/cancel-stdout.log' `
                -RedirectStandardError 'artifacts/cancel-stderr.log'
              $cancelEditor = Wait-ProcessWindow -ProcessId $cancelProcess.Id -MinWidth 800 -MinHeight 600
              [DesktopNative]::SetForegroundWindow($cancelEditor) | Out-Null
              [DesktopNative]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::keybd_event(0x1B, 0, 0x0002, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              if ([DesktopNative]::IsWindowVisible($cancelEditor)) { throw 'Escape did not cancel screenshot' }
              $diagnostics.screenshotCancelWorks = $true
              Stop-TestProcess -Process $cancelProcess

              # 复制流程检查 Windows 剪贴板中确实有选区图片及正确尺寸。
              $copyProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/copy-stdout.log' `
                -RedirectStandardError 'artifacts/copy-stderr.log'
              $copyEditor = Wait-ProcessWindow -ProcessId $copyProcess.Id -MinWidth 800 -MinHeight 600
              $copyRect = New-Object DesktopNative+Rect
              [DesktopNative]::GetWindowRect($copyEditor, [ref]$copyRect) | Out-Null
              $copyStartX = $copyRect.Left + 120
              $copyStartY = $copyRect.Top + 100
              $copyEndX = $copyStartX + 420
              $copyEndY = $copyStartY + 250
              [DesktopNative]::SetForegroundWindow($copyEditor) | Out-Null
              [DesktopNative]::SetCursorPos($copyStartX, $copyStartY) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              for ($step = 1; $step -le 10; $step++) {
                [DesktopNative]::SetCursorPos(
                  [int]($copyStartX + (($copyEndX - $copyStartX) * $step / 10)),
                  [int]($copyStartY + (($copyEndY - $copyStartY) * $step / 10))
                ) | Out-Null
                Start-Sleep -Milliseconds 35
              }
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              [DesktopNative]::GetWindowRect($copyEditor, [ref]$copyRect) | Out-Null
              [DesktopNative]::SetCursorPos($copyRect.Right - 138, $copyRect.Bottom - 42) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              if ([DesktopNative]::IsWindowVisible($copyEditor)) { throw 'Copy did not close screenshot editor' }
              $clipboardProbe = Join-Path $testRoot 'copied-screenshot.png'
              $clipboardScript = Join-Path $testRoot 'save-image-clipboard.ps1'
              @'
          param([string]$Path)
          Add-Type -AssemblyName System.Windows.Forms
          $image = [System.Windows.Forms.Clipboard]::GetImage()
          if (-not $image) { throw 'Screenshot copy did not put an image on the clipboard' }
          try { $image.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png) }
          finally { $image.Dispose() }
          '@ | Set-Content -Path $clipboardScript -Encoding UTF8
              & powershell.exe -NoProfile -STA -File $clipboardScript $clipboardProbe
              if ($LASTEXITCODE -ne 0) { throw 'Could not read copied screenshot from Windows clipboard' }
              $copiedImage = [System.Drawing.Image]::FromFile($clipboardProbe)
              try {
                if ([Math]::Abs($copiedImage.Width - 420) -gt 2 -or [Math]::Abs($copiedImage.Height - 250) -gt 2) {
                  throw "Copied screenshot size is $($copiedImage.Width)x$($copiedImage.Height), expected 420x250"
                }
                $diagnostics.screenshotCopySize = @($copiedImage.Width, $copiedImage.Height)
              } finally { $copiedImage.Dispose() }
              Stop-TestProcess -Process $copyProcess
            }

            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.17') {
              # 新版设置页嵌入主搜索框，真实提醒仍使用独立窗口。
              Stop-TestProcess -Process $historyProcess
              $env:ZTOOLS_E2E_PLUGIN_NAME = 'break-reminder'
              $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'settings'
              $embedBreakSettings = [version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.19'
              if ($embedBreakSettings) { $env:ZTOOLS_E2E_EMBED_PLUGIN = '1' }
              $breakSettingsProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/break-settings-stdout.log' `
                -RedirectStandardError 'artifacts/break-settings-stderr.log'
              if ($embedBreakSettings) {
                $settingsWindow = Wait-WindowByTitleNearSize -Title 'ZTools' `
                  -ExpectedWidth 800 -ExpectedHeight 600 -Tolerance 80
                if ([DesktopNative]::FindVisibleWindowByTitleNearSize('休息提醒', 540, 570) -ne [IntPtr]::Zero) {
                  throw 'Break settings opened an extra plugin window'
                }
                $diagnostics.breakSettingsEmbedded = $true
              } else {
                $settingsWindow = Wait-WindowByTitleNearSize -Title '休息提醒' `
                  -ExpectedWidth 540 -ExpectedHeight 570 -Tolerance 80
              }
              $diagnostics.breakSettingsVisible = $true
              # WebView2 子视图可能晚于宿主窗口出现；等待正文渲染再测双击分离。
              Start-Sleep -Seconds 4
              Save-DesktopScreenshot -Path 'artifacts/10-break-settings.png'
              if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.21') {
                # 用真实鼠标双击搜索栏，确认内嵌 WebView 原位迁移到独立窗口。
                [DesktopNative]::SetForegroundWindow($settingsWindow) | Out-Null
                Start-Sleep -Milliseconds 350
                $settingsRect = New-Object DesktopNative+Rect
                [DesktopNative]::GetWindowRect($settingsWindow, [ref]$settingsRect) | Out-Null
                [DesktopNative]::SetCursorPos($settingsRect.Left + 230, $settingsRect.Top + 30) | Out-Null
                [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
                Start-Sleep -Milliseconds 120
                [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
                [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
                $detachedSettings = Wait-WindowByTitleNearSize -Title '休息提醒' `
                  -ExpectedWidth 800 -ExpectedHeight 600 -Tolerance 100
                $diagnostics.breakSettingsDetached = $true
                Save-DesktopScreenshot -Path 'artifacts/10-break-settings-detached.png'
              }
              Stop-TestProcess -Process $breakSettingsProcess
              Start-Sleep -Seconds 2

              # 单独打开休息页，用真实按键触发唯一的“跳过本次提醒”按钮。
              Remove-Item Env:ZTOOLS_E2E_EMBED_PLUGIN -ErrorAction SilentlyContinue
              $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'break'
              $env:ZTOOLS_E2E_PLUGIN_PAYLOAD = '{"durationSeconds":120}'
              $breakProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/break-stdout.log' `
                -RedirectStandardError 'artifacts/break-stderr.log'
              $breakWindow = Wait-WindowByTitleNearSize -Title '休息提醒' `
                -ExpectedWidth 440 -ExpectedHeight 400 -Tolerance 80
              Save-DesktopScreenshot -Path 'artifacts/11-break-reminder.png'
              [DesktopNative]::SetForegroundWindow($breakWindow) | Out-Null
              $breakRect = New-Object DesktopNative+Rect
              [DesktopNative]::GetWindowRect($breakWindow, [ref]$breakRect) | Out-Null
              # WebView2 的初始键盘焦点不稳定，直接点击可见按钮验证真实鼠标交互。
              [DesktopNative]::SetCursorPos(
                [int](($breakRect.Left + $breakRect.Right) / 2), $breakRect.Bottom - 50
              ) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              if ([DesktopNative]::IsWindowVisible($breakWindow)) {
                throw 'Skip button did not close the break reminder'
              }
              $diagnostics.breakSkipClosedWindow = $true
              Save-DesktopScreenshot -Path 'artifacts/12-break-skipped.png'
            }

            if ([version]$env:RELEASE_TAG.TrimStart('v') -ge [version]'0.1.22') {
              # 用当前便携包打开内置原版剪贴板，验证 Windows 子 Webview 和文本监控一起启动。
              Stop-TestProcess -Process $breakProcess
              Remove-Item Env:ZTOOLS_E2E_PLUGIN_PAYLOAD -ErrorAction SilentlyContinue
              $env:ZTOOLS_E2E_PLUGIN_NAME = 'clipboard'
              $env:ZTOOLS_E2E_PLUGIN_FEATURE = 'clipboard'
              $env:ZTOOLS_E2E_EMBED_PLUGIN = '1'
              Set-Clipboard -Value 'ZTOOLS_CLIPBOARD_WIN_SMOKE'
              $clipboardProcess = Start-Process -FilePath $executable -PassThru `
                -RedirectStandardOutput 'artifacts/clipboard-stdout.log' `
                -RedirectStandardError 'artifacts/clipboard-stderr.log'
              $clipboardWindow = Wait-ProcessWindow -ProcessId $clipboardProcess.Id -MinWidth 700 -MinHeight 550
              Start-Sleep -Seconds 5
              Save-DesktopScreenshot -Path 'artifacts/13-clipboard.png'
              $diagnostics.clipboardVisible = [DesktopNative]::IsWindowVisible($clipboardWindow)
              if (-not $diagnostics.clipboardVisible) { throw 'Original clipboard plugin is not visible' }

              # 使用 Windows 原生 CF_HDROP 放入文件路径，检查文件历史页的真实桌面渲染。
              $clipboardFile = Join-Path $testRoot 'clipboard-file.txt'
              Set-Content -Path $clipboardFile -Value 'ZTools clipboard file fixture'
              $clipboardScript = Join-Path $testRoot 'set-file-clipboard.ps1'
              @'
          param([string]$Path)
          Add-Type -AssemblyName System.Windows.Forms
          $files = New-Object System.Collections.Specialized.StringCollection
          [void]$files.Add($Path)
          [System.Windows.Forms.Clipboard]::SetFileDropList($files)
          '@ | Set-Content -Path $clipboardScript -Encoding UTF8
              & powershell.exe -NoProfile -STA -File $clipboardScript $clipboardFile
              if ($LASTEXITCODE -ne 0) { throw 'Could not set Windows file clipboard' }
              Start-Sleep -Seconds 3
              $clipboardRect = New-Object DesktopNative+Rect
              [DesktopNative]::GetWindowRect($clipboardWindow, [ref]$clipboardRect) | Out-Null
              [DesktopNative]::SetCursorPos($clipboardRect.Left + 320, $clipboardRect.Top + 84) | Out-Null
              [DesktopNative]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
              [DesktopNative]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Seconds 1
              Save-DesktopScreenshot -Path 'artifacts/14-clipboard-files.png'
              $diagnostics.clipboardFileTabVisible = [DesktopNative]::IsWindowVisible($clipboardWindow)
            }
          } catch {
            $diagnostics.error = $_.Exception.Message
            Save-DesktopScreenshot -Path 'artifacts/99-error.png'
            throw
          } finally {
            $diagnostics | ConvertTo-Json -Depth 4 | Set-Content artifacts/diagnostics.json
            Stop-TestProcess -Process $launcherProcess
            Stop-TestProcess -Process $screenshotProcess
            Stop-TestProcess -Process $historyProcess
            Stop-TestProcess -Process $cancelProcess
            Stop-TestProcess -Process $copyProcess
            Stop-TestProcess -Process $breakSettingsProcess
            Stop-TestProcess -Process $breakProcess
            Stop-TestProcess -Process $clipboardProcess
          }

      - name: Upload Windows desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke-${{ inputs.release_tag }}
          path: artifacts
          if-no-files-found: error
