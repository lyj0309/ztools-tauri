<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/_ui/theme.css" />
    <link rel="stylesheet" href="history.css" />
  <title>贴图 · 历史图片</title>
</head>
<body class="z-ui-page">
  <header class="z-ui-page-header"><div><strong class="z-ui-title">贴图</strong><p class="z-ui-description">选择剪贴板历史图片</p></div><div class="z-ui-actions"><button class="z-ui-button" id="refresh" type="button">刷新</button><button class="z-ui-button" id="close" type="button" aria-label="关闭">×</button></div></header>
  <main aria-label="剪贴板历史图片"><p class="z-ui-empty" id="message" role="status">正在读取图片…</p><div id="images" role="group" aria-label="图片列表"></div></main>
  <footer><span>双击图片或按 Enter 贴图 · Esc 返回</span><button class="z-ui-button z-ui-button-primary" id="pin" type="button" disabled>贴图</button></footer>
  <script type="module" src="history.js"></script>
</body>
</html>
