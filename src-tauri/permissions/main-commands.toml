[[permission]]
identifier = "main-commands"
description = "Allows the trusted launcher window to call ZTools host commands."
commands.allow = [
  "bootstrap_launcher",
  "refresh_applications",
  "launch_application",
  "set_application_pinned",
  "clear_launch_history",
  "capture_clipboard",
  "copy_clipboard_text",
  "delete_clipboard_entry",
  "clear_clipboard_history",
  "open_dropped_path",
  "reveal_dropped_path",
  "add_local_shortcut",
  "update_local_shortcut_alias",
  "delete_local_shortcut",
  "update_launcher_settings",
  "hide_main_window",
  "sync_now",
  "get_sync_status",
  "send_test_notification",
  "capture_screen",
  "check_for_updates",
  "install_update",
  "open_external_url",
  "run_system_command",
  "http_request",
  "detect_legacy_data",
  "import_legacy_data",
  "create_backup",
  "restore_backup",
  "list_plugins",
  "fetch_plugin_market",
  "install_plugin_from_market",
  "cancel_plugin_market_install",
  "install_plugin_directory",
  "register_plugin_development",
  "stop_plugin_development",
  "uninstall_plugin",
  "launch_plugin_feature"
]
