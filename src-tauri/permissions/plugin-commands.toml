  "plugin_hide_main_window",
  "plugin_db_put",
  "plugin_db_remove",
  "plugin_storage_set",
  "plugin_storage_remove",
  "plugin_feature_set",
  "plugin_feature_remove",
  "plugin_attachment_put",
  "plugin_attachment_get",
  "plugin_attachment_remove",
  "plugin_file_stats",
  "plugin_read_directory",
  "plugin_path_exists",
  "plugin_rename_path",
  "plugin_read_file",
  "plugin_write_file",
  "plugin_copy_path",
  "plugin_create_directory",
  "plugin_shell_open",
  "plugin_shell_reveal",
  "plugin_http_request",
  "plugin_dialog_open",
  "plugin_dialog_save",
  "plugin_window_set_size",
