[package]
name = "ztools-tauri"
version = "0.1.19"
description = "ZTools Tauri desktop host"
authors = ["ZToolsCenter"]
license = "MIT"
repository = "https://github.com/lyj0309/ztools-tauri"
edition = "2021"
rust-version = "1.77.2"
default-run = "ztools-tauri"

[lib]
name = "ztools_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
dirs = "6"
enigo = "0.6.1"
futures-util = "0.3"
heed = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
walkdir = "2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_Com", "Win32_System_WinRT"] }
libloading = "0.8"
ppocr-rs = { git = "https://github.com/dariofinardi/df-ppocr-rs", rev = "48e8cb67b72a194672587d9745aec5e65502423b", features = ["example-dynamic"] }
serde_yaml = "0.9"
tar = "0.4"
tokio = { version = "1", features = ["sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
